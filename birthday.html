<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>

body{
margin:0;
background:#f2f3f7;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* カード */

.card{
width:92%;
max-width:420px;
background:white;
border-radius:20px;
box-shadow:0 8px 24px rgba(0,0,0,0.12);
overflow:hidden;
}

/* 画像 */

.card img{
width:100%;
display:block;
}

/* 下のメッセージ */

.message{
padding:20px;
text-align:center;
}

.message h1{
margin:0 0 10px;
font-size:26px;
}

.message p{
margin:0;
font-size:16px;
color:#555;
}

</style>
</head>

<body>

<div class="card">

<img src="birthday.png">

<div class="message">
<h1>🎉 Happy Birthday 🎉</h1>
<p>素敵な一年になりますように</p>
</div>

</div>

</body>
</html>
