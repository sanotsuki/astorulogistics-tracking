<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:black;
}

/* ローディング */

#loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f2f3f7;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:50;
font-size:18px;
color:#333;
}

.loader{
width:40px;
height:40px;
border:4px solid #ddd;
border-top:4px solid #0a2c5e;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:15px;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* タップ */

#tapMessage{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f2f3f7;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
color:#333;
opacity:0;
pointer-events:none;
z-index:40;
}

#tapMessage.show{
opacity:1;
pointer-events:auto;
}

/* ケーキ */

.hero{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
animation:zoom 10s ease forwards;
display:none;
z-index:1;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* confetti canvas */

#confetti{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:10;
}

/* フラッシュ */

.flash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
opacity:0;
pointer-events:none;
z-index:20;
}

.flash.show{
animation:flashAnim 0.7s ease;
}

@keyframes flashAnim{
0%{opacity:0;}
20%{opacity:0.9;}
100%{opacity:0;}
}

/* 署名 */

.from{
position:fixed;
right:20px;
bottom:20px;
color:white;
font-size:20px;
opacity:0;
transition:1s;
text-shadow:0 2px 8px rgba(0,0,0,0.6);
z-index:30;
}

.show{
opacity:1;
}

</style>
</head>

<body>

<div id="loading">
<div class="loader"></div>
<p>情報を取得しています...</p>
</div>

<div id="tapMessage">
画面をタップしてください
</div>

<img src="birthday.PNG" class="hero">

<canvas id="confetti"></canvas>

<div id="flash" class="flash"></div>

<div id="from" class="from">
From アストル3年目
</div>

<audio id="pop" src="party_poppers3.mp3"></audio>
<audio id="music" src="happybirthday.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* ローディング */

setTimeout(()=>{

document.getElementById("loading").style.display="none"
document.getElementById("tapMessage").classList.add("show")

},2800)

/* タップ開始 */

document.getElementById("tapMessage").addEventListener("click", startSurprise)

function startSurprise(){

document.getElementById("tapMessage").style.display="none"

const music = document.getElementById("music")

/* iPhone用 音声許可 */

music.volume=0
music.play().then(()=>{
music.pause()
music.currentTime=0
})

document.querySelector(".hero").style.display="block"

setTimeout(()=>{

document.getElementById("flash").classList.add("show")

const pop = document.getElementById("pop")

pop.volume = 1
pop.play()

/* 紙吹雪 */

const canvas = document.getElementById("confetti")
const myConfetti = confetti.create(canvas,{resize:true})

const duration = 4000
const end = Date.now() + duration

function frame(){

myConfetti({
particleCount:10,
angle:60,
spread:70,
origin:{x:0},
colors:['#FFD700','#FFC107','#FFB300']
})

myConfetti({
particleCount:10,
angle:120,
spread:70,
origin:{x:1},
colors:['#FFD700','#FFC107','#FFB300']
})

if(Date.now() < end){
requestAnimationFrame(frame)
}

}

frame()

/* クラッカー音フェード */

let fade = setInterval(()=>{

if(pop.volume > 0.05){

pop.volume -= 0.05

}else{

pop.volume = 0
clearInterval(fade)

/* HappyBirthday再生 */

setTimeout(()=>{

music.volume=0
music.play()

let musicFade = setInterval(()=>{

if(music.volume < 0.7){
music.volume += 0.05
}else{
clearInterval(musicFade)
}

},200)

},500)

}

},200)

/* From表示 */

setTimeout(()=>{
document.getElementById("from").classList.add("show")
},4500)

},500)

}

</script>

</body>
</html>
