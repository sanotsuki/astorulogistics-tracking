<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

/* 全画面画像 */

.hero{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
}

/* 紙吹雪 */

#confetti{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

/* 署名 */

.from{
position:fixed;
right:20px;
bottom:20px;
color:white;
font-size:18px;
opacity:0;
transition:1s;
}

.show{
opacity:1;
}

</style>
</head>

<body>

<img src="birthday.PNG" class="hero">

<canvas id="confetti"></canvas>

<div id="from" class="from">
From アストル3年目
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* 紙吹雪開始（3秒後） */

setTimeout(()=>{

const duration = 4000
const end = Date.now() + duration

function frame(){

confetti({
particleCount:4,
angle:60,
spread:70,
origin:{x:0},
colors:['#FFD700','#FFC107','#FFB300']
})

confetti({
particleCount:4,
angle:120,
spread:70,
origin:{x:1},
colors:['#FFD700','#FFC107','#FFB300']
})

if(Date.now() < end){
requestAnimationFrame(frame)
}else{
document.getElementById("from").classList.add("show")
}

}

frame()

},3000)

</script>

</body>
</html>
