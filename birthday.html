<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>

body{
margin:0;
background:#f2f3f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
overflow:hidden;
}

/* カード */

.card{
position:relative;
width:92%;
max-width:420px;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* 画像 */

.card img{
width:100%;
display:block;
}

/* 紙吹雪キャンバス */

#confetti{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

</style>
</head>

<body>

<div class="card">
<img src="images/birthday.png">
</div>

<canvas id="confetti"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* 3秒後に紙吹雪 */

setTimeout(()=>{

const duration = 4000
const end = Date.now() + duration

function frame(){

confetti({
particleCount:4,
angle:60,
spread:70,
origin:{x:0}
})

confetti({
particleCount:4,
angle:120,
spread:70,
origin:{x:1}
})

if(Date.now() < end){
requestAnimationFrame(frame)
}

}

frame()

},3000)

</script>

</body>
</html>
