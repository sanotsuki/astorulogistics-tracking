<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

/* 全画面ケーキ */

.hero{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
animation:zoom 8s ease forwards;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* 紙吹雪 */

#confetti{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

/* フラッシュ */

.flash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
opacity:0;
pointer-events:none;
}

.flash.show{
animation:flashAnim 0.7s ease;
}

@keyframes flashAnim{
0%{opacity:0;}
20%{opacity:0.8;}
100%{opacity:0;}
}

/* 署名 */

.from{
position:fixed;
right:20px;
bottom:20px;
color:white;
font-size:18px;
opacity:0;
transition:1s;
}

.show{
opacity:1;
}

</style>
</head>

<body>

<img src="birthday.PNG" class="hero">

<canvas id="confetti"></canvas>

<div id="flash" class="flash"></div>

<div id="from" class="from">
From アストル3年目
</div>

<audio id="pop" src="party.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

setTimeout(()=>{

/* フラッシュ */

document.getElementById("flash").classList.add("show")

/* クラッカー音 */

document.getElementById("pop").play()

const duration = 4000
const end = Date.now() + duration

function frame(){

confetti({
particleCount:5,
angle:60,
spread:70,
origin:{x:0},
colors:['#FFD700','#FFC107','#FFB300']
})

confetti({
particleCount:5,
angle:120,
spread:70,
origin:{x:1},
colors:['#FFD700','#FFC107','#FFB300']
})

if(Date.now() < end){
requestAnimationFrame(frame)
}else{
document.getElementById("from").classList.add("show")
}

}

frame()

},2000)

</script>

</body>
</html>
