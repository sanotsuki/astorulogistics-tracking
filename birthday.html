<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:black;
}

/* ローディング */

#loading{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f2f3f7;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:50;
font-size:18px;
color:#333;
}

.loader{
width:40px;
height:40px;
border:4px solid #ddd;
border-top:4px solid #0a2c5e;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:15px;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* タップ画面 */

#tapMessage{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#f2f3f7;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
color:#333;
opacity:0;
pointer-events:none;
z-index:40;
}

#tapMessage.show{
opacity:1;
pointer-events:auto;
}

/* ケーキ画像 */

.hero{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
animation:zoom 10s ease forwards;
display:none;
z-index:1;

will-change:transform;
transform:translateZ(0);
backface-visibility:hidden;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* フラッシュ */

.flash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
opacity:0;
pointer-events:none;
z-index:20;
}

.flash.show{
animation:flashAnim 0.7s ease;
}

@keyframes flashAnim{
0%{opacity:0;}
20%{opacity:0.9;}
100%{opacity:0;}
}

/* キラキラ */

.sparkle{
position:fixed;
width:6px;
height:6px;
background:white;
border-radius:50%;
opacity:0;
animation:sparkleAnim 1.5s linear forwards;
z-index:25;
}

@keyframes sparkleAnim{
0%{opacity:0;transform:scale(0);}
50%{opacity:1;transform:scale(1.5);}
100%{opacity:0;transform:scale(0);}
}

/* 署名 */

.from{
position:fixed;
right:20px;
bottom:20px;
color:white;
font-size:20px;
opacity:0;
transition:1s;
text-shadow:0 2px 8px rgba(0,0,0,0.6);
z-index:30;
}

.show{
opacity:1;
}

</style>
</head>

<body>

<div id="loading">
<div class="loader"></div>
<p>情報を取得しています...</p>
</div>

<div id="tapMessage">
画面をタップしてください
</div>

<img src="birthday.PNG" class="hero">

<div id="flash" class="flash"></div>

<div id="from" class="from">
From アストル3年目
</div>

<audio id="pop" src="party_poppers3.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* ローディング終了 */

setTimeout(()=>{

document.getElementById("loading").style.display="none"
document.getElementById("tapMessage").classList.add("show")

},2800)

/* タップで開始 */

document.getElementById("tapMessage").addEventListener("click", startSurprise)

function startSurprise(){

document.getElementById("tapMessage").style.display="none"

document.querySelector(".hero").style.display="block"

setTimeout(()=>{

/* フラッシュ */

document.getElementById("flash").classList.add("show")

/* クラッカー音 */

const pop = document.getElementById("pop")
pop.volume = 1
pop.play()

/* 音フェード */

let fade = setInterval(()=>{

if(pop.volume > 0.05){
pop.volume -= 0.05
}else{
pop.volume = 0
clearInterval(fade)
}

},200)

/* 紙吹雪 */

const duration = 4000
const end = Date.now() + duration

function frame(){

confetti({
particleCount:10,
angle:60,
spread:70,
origin:{x:0},
colors:['#FFD700','#FFC107','#FFB300']
})

confetti({
particleCount:10,
angle:120,
spread:70,
origin:{x:1},
colors:['#FFD700','#FFC107','#FFB300']
})

if(Date.now() < end){
requestAnimationFrame(frame)
}else{

// createSparkles()
document.getElementById("from").classList.add("show")

}

}

frame()

},500)

}

/* キラキラ生成 */

function createSparkles(){

for(let i=0;i<30;i++){

setTimeout(()=>{

const s=document.createElement("div")
s.className="sparkle"

s.style.left=Math.random()*100+"vw"
s.style.top=Math.random()*100+"vh"

document.body.appendChild(s)

setTimeout(()=>{s.remove()},1500)

},i*80)

}

}

</script>

</body>
</html>
