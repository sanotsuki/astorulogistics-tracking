<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アストル運送 不在票</title>
<style>
body {
  margin: 0;
  font-family: "Segoe UI", Roboto, -apple-system, sans-serif;
}

.container {
  width: 800px;
  margin: 0 auto;
  border: 2px solid #004080;
  background-color: #004080; /* 青系背景 */
  color: #fff;
  padding: 20px;
  box-sizing: border-box;
}

.header {
  display: flex;
  align-items: center;
  margin-bottom: 15px;
}

.header img {
  height: 60px;
  margin-right: 15px;
}

.header h1 {
  font-size: 24px;
  margin: 0;
}

.section {
  background-color: #0059b3; /* 濃い青系で区切り */
  padding: 10px;
  margin-bottom: 10px;
}

.section label {
  display: inline-block;
  width: 150px;
  font-weight: bold;
}

input[type="text"] {
  width: 250px;
  padding: 5px;
  border: 1px solid #fff;
  background: transparent;
  color: #fff;
}

.checkbox-group {
  display: flex;
  gap: 20px;
  margin-top: 5px;
}

.checkbox-group input {
  width: auto;
}

.notes {
  margin-top: 15px;
  padding: 10px;
  background-color: #0066cc;
  min-height: 60px;
}

.footer {
  font-size: 12px;
  margin-top: 15px;
  border-top: 1px solid #fff;
  padding-top: 5px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="astoru_logo.png" alt="アストル運送 ロゴ">
    <h1>ご不在連絡票</h1>
  </div>

  <div class="section">
    <label>お名前:</label>
    <input type="text" placeholder="姓">
    <input type="text" placeholder="名">
  </div>

  <div class="section">
    <p>お届けに参りましたがご不在でした:</p>
    <div class="checkbox-group">
      <label><input type="checkbox">宅配便</label>
      <label><input type="checkbox">クール（冷蔵・冷凍）</label>
      <label><input type="checkbox">着払</label>
    </div>
  </div>

  <div class="section">
    <p>お荷物詳細:</p>
    <div class="checkbox-group">
      <label><input type="checkbox">生もの</label>
      <label><input type="checkbox">食品</label>
      <label><input type="checkbox">衣類</label>
      <label><input type="checkbox">書類</label>
      <label><input type="checkbox">その他</label>
    </div>
  </div>

  <div class="section notes">
    ご連絡欄：
  </div>

  <div class="footer">
    アストル運送株式会社
  </div>
</div>

</body>
</html>
